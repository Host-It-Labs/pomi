[package]
name = "tauri-plugin-watch-sync"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-watch-sync"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
