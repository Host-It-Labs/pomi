[package]
name = "pomi"
version = "0.0.1"
description = "Pomi desktop and mobile client"
authors = ["William Guinaudie"]
license-file = "../../../LICENSE"
repository = "https://github.com/Host-It-Labs/pomi"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [ "tray-icon", "image-png" ] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-http = "=2.5.9"
tauri-plugin-os = "=2.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notifications = "0.4.3"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-keyring = "0.1.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notifications = { version = "0.4.3", features = ["push-notifications"] }
tauri-plugin-android-battery-optimization = "0.1.4"

[patch.crates-io]
tauri-plugin-notifications = { path = "vendor/tauri-plugin-notifications" }
