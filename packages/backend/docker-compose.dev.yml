services:
  backend:
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile.dev
    ports:
      - '${POMI_BACKEND_PORT:-3000}:3000'
    volumes:
      - ../..:/app
      - /app/node_modules
      - /app/packages/backend/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/pomodoro
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - NEST_PORT=3000
      - APP_NAME=${APP_NAME:-pomi}
      - JWT_SECRET=${JWT_SECRET:-pomi-development-only-secret-never-use-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - NEST_SENTRY_DSN=${NEST_SENTRY_DSN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - GITHUB_FEEDBACK_APP_ID=${GITHUB_FEEDBACK_APP_ID:-}
      - GITHUB_FEEDBACK_APP_INSTALLATION_ID=${GITHUB_FEEDBACK_APP_INSTALLATION_ID:-}
      - GITHUB_FEEDBACK_APP_PRIVATE_KEY_PATH=/app/${GITHUB_FEEDBACK_APP_PRIVATE_KEY_PATH:-config/secrets/pomi-radar.private-key.pem}
      - GITHUB_FEEDBACK_REPOSITORY=${GITHUB_FEEDBACK_REPOSITORY:-}
      - GITHUB_FEEDBACK_LABEL=${GITHUB_FEEDBACK_LABEL:-ignore}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/${POMI_FIREBASE_SERVICE_ACCOUNT_PATH:-config/secrets/firebase-service-account.json}

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pomodoro
    volumes:
      - ./pgdata18:/var/lib/postgresql
    ports:
      - '${POMI_DB_PORT:-5432}:5432'

  redis:
    image: redis:8-alpine
    ports:
      - '${POMI_REDIS_PORT:-6379}:6379'

# No named volumes needed for dev DB and Redis
