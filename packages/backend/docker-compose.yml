services:
  backend:
    image: ${POMI_BACKEND_IMAGE:-pomi-backend:local}
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
    ports:
      - '${POMI_BIND_ADDRESS:-127.0.0.1}:${POMI_BACKEND_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEST_PORT: '3000'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-pomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pomi}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      NEST_SENTRY_DSN: ${NEST_SENTRY_DSN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPOSITORY: ${GITHUB_FEEDBACK_REPOSITORY:-}
      GITHUB_FEEDBACK_LABEL: ${GITHUB_FEEDBACK_LABEL:-feedback}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APN_KEY_PATH: ${APN_KEY_PATH:-}
      APN_KEY_ID: ${APN_KEY_ID:-}
      APN_TEAM_ID: ${APN_TEAM_ID:-}
      APN_BUNDLE_ID: ${APN_BUNDLE_ID:-app.pomi.community}
      APN_PRODUCTION: ${APN_PRODUCTION:-false}
      POMI_HOSTING_MODE: ${POMI_HOSTING_MODE:-self-hosted}
      POMI_TRUST_PROXY: ${POMI_TRUST_PROXY:-}
      BILLING_RATE_LIMIT_HASH_SECRET: ${BILLING_RATE_LIMIT_HASH_SECRET:-}
      GOOGLE_AUTH_CLIENT_IDS: ${GOOGLE_AUTH_CLIENT_IDS:-}
      APPLE_AUTH_CLIENT_IDS: ${APPLE_AUTH_CLIENT_IDS:-}
      POMI_SUBSCRIPTION_MONTHLY_PRODUCT_ID: ${POMI_SUBSCRIPTION_MONTHLY_PRODUCT_ID:-app.pomi.community.pro.monthly}
      POMI_SUBSCRIPTION_YEARLY_PRODUCT_ID: ${POMI_SUBSCRIPTION_YEARLY_PRODUCT_ID:-app.pomi.community.pro.yearly}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-app.pomi.community}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-app.pomi.community}
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      APPLE_IAP_ENVIRONMENT: ${APPLE_IAP_ENVIRONMENT:-sandbox}
      APPLE_ROOT_CA_PATHS: ${APPLE_ROOT_CA_PATHS:-}
    restart: unless-stopped
    networks:
      - public
      - private

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pomi}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  pgdata17:
  redisdata:

networks:
  public:
  private:
    internal: true
