services:
  backend:
    # Override POMI_BACKEND_IMAGE to use a published image instead of the local
    # tag. When using a published image, pull it and omit `--build` from `up`.
    image: ${POMI_BACKEND_IMAGE:-pomi-backend:local}
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
    # Bind to loopback by default. An HTTPS reverse proxy should expose the API.
    ports:
      - '${POMI_BIND_ADDRESS:-127.0.0.1}:${POMI_BACKEND_PORT:-3000}:3000'
    volumes:
      # To enable APNs, set APN_KEY_FILE to the host path of the downloaded .p8
      # file and APN_KEY_PATH to /run/secrets/pomi-apns-key.p8. /dev/null keeps
      # this optional integration disabled when no host key file is configured.
      - type: bind
        source: ${APN_KEY_FILE:-/dev/null}
        target: /run/secrets/pomi-apns-key.p8
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEST_PORT: '3000'

      # PostgreSQL connection. POSTGRES_PASSWORD must be the same value used by
      # the db service below. Keep the existing value when upgrading a database.
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-pomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pomi}

      # Redis is private to this stack. REDIS_PASSWORD must be the same value
      # passed to redis-server below.
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

      # Generate JWT_SECRET with `openssl rand -hex 32`. Changing it signs every
      # user out. CORS_ORIGINS is a comma-separated list of exact origins, with
      # no paths or trailing slashes; add the web app origin when applicable.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}

      # Optional integrations remain disabled when their values are blank.
      NEST_SENTRY_DSN: ${NEST_SENTRY_DSN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPOSITORY: ${GITHUB_FEEDBACK_REPOSITORY:-}
      GITHUB_FEEDBACK_LABEL: ${GITHUB_FEEDBACK_LABEL:-feedback}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APN_KEY_PATH: ${APN_KEY_PATH:-}
      APN_KEY_ID: ${APN_KEY_ID:-}
      APN_TEAM_ID: ${APN_TEAM_ID:-}
      APN_BUNDLE_ID: ${APN_BUNDLE_ID:-app.pomi.community}
      APN_PRODUCTION: ${APN_PRODUCTION:-false}
    restart: unless-stopped
    networks:
      - public
      - private

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pomi}
    volumes:
      # Back up and restore PostgreSQL before changing its major version or
      # moving an existing installation to this named volume.
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

  redis:
    image: redis:7-alpine
    # Do not publish port 6379. Only services on the private network need Redis.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - private

volumes:
  pgdata17:
  redisdata:

networks:
  public:
  private:
    internal: true
