name: PR Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: Backend image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pomodoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d pomodoro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgres://user:password@localhost:5432/pomodoro
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare backend environment
        run: cp .env.example .env.local

      - name: Build
        run: pnpm -r run build

      - name: Verify multilingual UI coverage
        run: pnpm test:i18n

      - name: Run migrations
        run: pnpm --filter @pomi/backend migration:run

      - name: Lint
        run: pnpm lint

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Vitest business specifications, integration, browser, and coverage reporting
        run: pnpm test:business

      - name: Audit public-source boundary
        run: pnpm audit:public-source

      - name: Test public snapshot generation
        run: pnpm test:public-snapshot

      - name: Upload TypeScript coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-coverage-and-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            coverage
            test-results
            playwright-report

  wear:
    name: Wear
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Wear tests and coverage
        working-directory: packages/frontend/src-tauri/gen/android
        run: ./gradlew -p wear -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2 testDebugUnitTest koverVerifyDebug koverXmlReportDebug

      - name: Upload Wear diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wear-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/frontend/src-tauri/gen/android/wear/build/reports/tests
            packages/frontend/src-tauri/gen/android/wear/build/reports/kover
            packages/frontend/src-tauri/gen/android/wear/build/test-results

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend/src-tauri

      - name: Check formatting
        working-directory: packages/frontend/src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: packages/frontend/src-tauri
        run: cargo check

      - name: Run Rust tests
        working-directory: packages/frontend/src-tauri
        run: cargo test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend/src-tauri
          key: android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @pomi/shared build

      - name: Build unsigned Android release APK
        working-directory: packages/frontend
        run: pnpm exec tauri android build --ci --target aarch64 --apk

  tests:
    name: tests
    if: ${{ always() && !cancelled() }}
    needs:
      - backend-image
      - typescript
      - wear
      - rust
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test jobs passed
        env:
          BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          WEAR_RESULT: ${{ needs.wear.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$BACKEND_IMAGE_RESULT" != "success" ] || \
             [ "$TYPESCRIPT_RESULT" != "success" ] || \
             [ "$WEAR_RESULT" != "success" ] || \
             [ "$RUST_RESULT" != "success" ] || \
             [ "$ANDROID_RESULT" != "success" ]; then
            echo "Backend image: $BACKEND_IMAGE_RESULT"
            echo "TypeScript: $TYPESCRIPT_RESULT"
            echo "Wear: $WEAR_RESULT"
            echo "Rust: $RUST_RESULT"
            echo "Android: $ANDROID_RESULT"
            exit 1
          fi
